name: expense
networks:
  default:
    name: pineapple
volumes:
  sudheer:
    external: true 

services:
    mysql:
      image: mysql:v.10.0
      #image: sudheer1995/mysql:waste
      container_name: mysql
      volumes:
      - source: sudheer
        target: /var/lib/mysql
        type: volume

    backend:
      image: backend:v.10.0
      #image: sudheer1995/backend:waste
      container_name: backend
      command: sh -c "sleep 48 && node /opt/server/index.js" 
      depends_on: 
       - mysql
      ports:
       - 8080:8080

    frontend:
      image: frontend:v.10.0
      #image: sudheer1995/frontend:waste
      container_name: frontend
      depends_on: 
       - backend
      ports:
       - 80:80

  

